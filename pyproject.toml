[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ytpipe"
version = "1.0.0"
description = "Download a YouTube video and stream it to stdout — correctly, merges included."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "ytpipe contributors" }]
keywords = ["youtube", "yt-dlp", "ffmpeg", "video", "stdout", "pipe"]
classifiers = [
    "Environment :: Console",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video",
]
dependencies = ["yt-dlp>=2024.1.1"]

[project.urls]
Homepage = "https://github.com/example/ytpipe"

[project.scripts]
ytpipe = "ytpipe.cli:entrypoint"

[tool.setuptools]
packages = ["ytpipe"]
